<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Sale</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="Steam Sale — точные таймеры до крупных сезонных распродаж и тематических фестивалей Steam.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">
  <header class="app-header">
    <div class="brand-icon">
      <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 65 65" fill="#fff">
        <use xlink:href="#steam-logo" x=".5" y=".5"/>
        <defs>
          <linearGradient id="steam-blue-grad" x2="50%" x1="50%" y2="100%" y1="0%">
            <stop stop-color="#111d2e" offset="0%"/>
            <stop stop-color="#051839" offset="21.2%"/>
            <stop stop-color="#0a1b48" offset="40.7%"/>
            <stop stop-color="#132e62" offset="58.1%"/>
            <stop stop-color="#144b7e" offset="73.8%"/>
            <stop stop-color="#136497" offset="87.3%"/>
            <stop stop-color="#1387b8" offset="100%"/>
          </linearGradient>
        </defs>
        <symbol id="steam-logo">
          <g>
            <path d="M1.305 41.202C5.259 54.386 17.488 64 31.959 64c17.673 0 32-14.327 32-32s-14.327-32-32-32C15.001 0 1.124 13.193.028 29.874c2.074 3.477 2.879 5.628 1.275 11.328z" fill="url(#steam-blue-grad)"/>
            <path d="M30.31 23.985l.003.158-7.83 11.375c-1.268-.058-2.54.165-3.748.662a8.14 8.14 0 0 0-1.498.8L.042 29.893s-.398 6.546 1.26 11.424l12.156 5.016c.6 2.728 2.48 5.12 5.242 6.27a8.88 8.88 0 0 0 11.603-4.782 8.89 8.89 0 0 0 .684-3.656L42.18 36.16l.275.005c6.705 0 12.155-5.466 12.155-12.18s-5.44-12.16-12.155-12.174c-6.702 0-12.155 5.46-12.155 12.174zm-1.88 23.05c-1.454 3.5-5.466 5.147-8.953 3.694a6.84 6.84 0 0 1-3.524-3.362l3.957 1.64a5.04 5.04 0 0 0 6.591-2.719 5.05 5.05 0 0 0-2.715-6.601l-4.1-1.695c1.578-.6 3.372-.62 5.05.077 1.7.703 3 2.027 3.696 3.72s.692 3.56-.01 5.246M42.466 32.1a8.12 8.12 0 0 1-8.098-8.113 8.12 8.12 0 0 1 8.098-8.111 8.12 8.12 0 0 1 8.1 8.111 8.12 8.12 0 0 1-8.1 8.113m-6.068-8.126a6.09 6.09 0 0 1 6.08-6.095c3.355 0 6.084 2.73 6.084 6.095a6.09 6.09 0 0 1-6.084 6.093 6.09 6.09 0 0 1-6.081-6.093z"/>
          </g>
        </symbol>
      </svg>
    </div>
    <h1 class="brand-title">Steam <span>Sale</span></h1>
  </header>

  <div id="urgent-banner">
    <span>⚡</span>
    <span id="urgent-text"></span>
  </div>

  <section class="timers">
    <article class="timer-card major" id="card-major">
      <div class="card-head">
        <div>
          <div class="card-kicker">Крупная распродажа</div>
        </div>
        <span class="status-pill" id="pill-major">Крупная распродажа</span>
      </div>
      <div class="card-title" id="name-major">—</div>
      <p class="card-desc" id="desc-major">—</p>
      <div class="card-date" id="date-major">—</div>

      <div class="clock" id="clock-major">
        <div class="clock-seg"><div class="clock-num" data-u="d">00</div><div class="clock-label">дней</div></div>
        <div class="clock-seg"><div class="clock-num" data-u="h">00</div><div class="clock-label">часов</div></div>
        <div class="clock-seg"><div class="clock-num" data-u="m">00</div><div class="clock-label">минут</div></div>
        <div class="clock-seg"><div class="clock-num" data-u="s">00</div><div class="clock-label">секунд</div></div>
      </div>

      <div class="card-foot">
        <span class="card-note" id="note-major"></span>
        <button class="btn" data-ics="major">📅 В календарь</button>
      </div>
    </article>

    <article class="timer-card minor" id="card-minor">
      <div class="card-head">
        <div>
          <div class="card-kicker">Небольшая распродажа</div>
        </div>
        <span class="status-pill" id="pill-minor">Тематический ивент</span>
      </div>
      <div class="card-title" id="name-minor">—</div>
      <p class="card-desc" id="desc-minor">—</p>
      <div class="card-date" id="date-minor">—</div>

      <div class="clock" id="clock-minor">
        <div class="clock-seg"><div class="clock-num" data-u="d">00</div><div class="clock-label">дней</div></div>
        <div class="clock-seg"><div class="clock-num" data-u="h">00</div><div class="clock-label">часов</div></div>
        <div class="clock-seg"><div class="clock-num" data-u="m">00</div><div class="clock-label">минут</div></div>
        <div class="clock-seg"><div class="clock-num" data-u="s">00</div><div class="clock-label">секунд</div></div>
      </div>

      <div class="card-foot">
        <span class="card-note" id="note-minor"></span>
        <button class="btn" data-ics="minor">📅 В календарь</button>
      </div>
    </article>
  </section>

  <section class="section">
    <div class="section-head">
      <div>
        <div class="section-title">Следующие распродажи</div>
        <div class="section-sub">Хронологический список ближайших событий Steam</div>
      </div>
      <div class="tabs" role="tablist" aria-label="Фильтр событий">
        <button class="tab active" data-tab="all" role="tab" aria-selected="true">Все</button>
        <button class="tab" data-tab="major" role="tab" aria-selected="false">Крупные</button>
        <button class="tab" data-tab="minor" role="tab" aria-selected="false">Небольшие</button>
      </div>
    </div>

    <div class="timeline" id="timeline"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
