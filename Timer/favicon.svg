<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" />

  <!-- Top Stopwatch Crown -->
  <rect x="29" y="7" width="6" height="3.5" rx="1.5" fill="#FFFFFF" opacity="0.95" />
  <line x1="32" y1="10.5" x2="32" y2="13.5" stroke="#FFFFFF" stroke-width="2.5" opacity="0.95" stroke-linecap="round" />

  <!-- Background Ring Track -->
  <circle cx="32" cy="33.5" r="17.5" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="3.5" />

  <!-- Active Glowing Countdown Arc -->
  <circle cx="32" cy="33.5" r="17.5" fill="none" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" stroke-dasharray="80 110" transform="rotate(-90 32 33.5)" filter="url(#subtleGlow)" />

  <!-- Clock Hands -->
  <circle cx="32" cy="33.5" r="2.6" fill="#FFFFFF" />
  <line x1="32" y1="33.5" x2="32" y2="23" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="33.5" x2="40.5" y2="27.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
</svg>
